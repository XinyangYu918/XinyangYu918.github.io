<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}{% unless page.section == 'home' %} — Xinyang Yu{% endunless %}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/personal.css' | relative_url }}">
  {% if page.section == 'cv' %}<script src="{{ '/assets/js/cv-progress.js' | relative_url }}" defer></script>{% endif %}
</head>
<body data-theme="warm">
<div class="wrap">
  {% include personal-header.html %}
  {{ content }}
  {% include personal-footer.html %}
</div>
</body>
</html>
